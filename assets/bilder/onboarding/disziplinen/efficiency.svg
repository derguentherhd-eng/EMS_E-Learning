<title>Efficiency: Wie viel Energie das Auto während der Endurance verbraucht</title>
<defs><g id="car">
  <rect x="-48" y="-23" width="9" height="46" rx="2" fill="#FFED00"/>
  <rect x="-36" y="-27" width="20" height="11" rx="3" fill="#000000" stroke="#8A8A8A"/>
