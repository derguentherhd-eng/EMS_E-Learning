  <path d="M0,0 L10,5 L0,10 z" fill="#C9C9C9"/></marker></defs>
<rect width="800" height="400" rx="4" fill="#1E1E1E"/>
<g font-family="Lato, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
<rect x="200" y="120" width="110" height="200" rx="12" fill="none" stroke="#C9C9C9" stroke-width="5"/><rect x="235" y="104" width="40" height="16" rx="4" fill="#C9C9C9"/><rect x="210" y="130" width="90" height="180" rx="6" fill="#FFED00"/><path d="M262,190 L242,230 L258,230 L248,265 L272,218 L256,218 Z" fill="#534495"/><text x="255" y="354" font-size="18" fill="#C9C9C9" text-anchor="middle" font-weight="400">vor der Endurance</text>
<rect x="490" y="120" width="110" height="200" rx="12" fill="none" stroke="#C9C9C9" stroke-width="5"/><rect x="525" y="104" width="40" height="16" rx="4" fill="#C9C9C9"/><rect x="500" y="247" width="90" height="63" rx="6" fill="#FFED00"/><path d="M552,190 L532,230 L548,230 L538,265 L562,218 L546,218 Z" fill="#534495"/><text x="545" y="354" font-size="18" fill="#C9C9C9" text-anchor="middle" font-weight="400">nach der Endurance</text>
