<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Platzhalter: schematische Seitenansicht eines Formula-Student-Rennwagens">
  <!-- Platzhalter – durch ein echtes Foto des aktuellen Fahrzeugs ersetzen.
       Die Hotspot-Punkte in Kapitel 2 sind auf diese Zeichnung abgestimmt. -->
  <rect width="800" height="400" fill="#2a2a2a"/>
  <path d="M40 330 H760" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="12 10"/>
  <!-- Frontflügel -->
  <path d="M60 228 L190 220 L190 238 L60 240 Z" fill="#ffed00"/>
  <!-- Nase und Fahrzeugkörper -->
  <path d="M120 250 L300 205 L360 160 L420 160 L470 205 L640 215 L700 250 L690 275 L130 278 Z" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linejoin="miter"/>
  <!-- Cockpit mit Überrollbügel -->
  <path d="M340 205 L370 150 L405 150 L420 205" fill="none" stroke="#f2f2f2" stroke-width="5"/>
  <circle cx="365" cy="170" r="14" fill="#534495"/>
  <!-- Antrieb / Akku (Fläche hinter dem Cockpit) -->
  <rect x="480" y="215" width="120" height="50" fill="none" stroke="#ffed00" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- Heckflügel -->
  <path d="M650 150 H760 V170 H650 Z" fill="#ffed00"/>
  <path d="M690 170 V215 M730 170 V215" stroke="#f2f2f2" stroke-width="4"/>
  <!-- Räder -->
  <circle cx="215" cy="290" r="44" fill="#1e1e1e" stroke="#f2f2f2" stroke-width="6"/>
  <circle cx="215" cy="290" r="14" fill="#5a5a5a"/>
  <circle cx="615" cy="290" r="46" fill="#1e1e1e" stroke="#f2f2f2" stroke-width="6"/>
  <circle cx="615" cy="290" r="14" fill="#5a5a5a"/>
  <text x="400" y="372" fill="#f2f2f2" font-family="Lato, Arial, sans-serif" font-size="22" text-anchor="middle">Platzhalter – durch echtes Foto ersetzen</text>
</svg>
